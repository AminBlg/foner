<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The idea the icon has to carry: the call is not on this computer. It is
       on a handset, over a link. So the mark is a phone with the call arriving
       across a wireless arc, rather than a bare handset like every other
       dialler.
       Drawn for 22 pixels, not for 128. An earlier version used two arcs a
       side and a thin outline: at tray size the arcs merged into the phone and
       the whole mark turned to mush. One arc a side, fewer and heavier
       strokes, and a gap wide enough to survive being scaled down. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3daee9"/>
      <stop offset="1" stop-color="#1b5f8c"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>

  <!-- The handset, held upright and kept narrow so the arcs have room. -->
  <rect x="52" y="34" width="24" height="60" rx="5"
        fill="#ffffff" opacity="0.97"/>
  <!-- Screen cut out of the body rather than drawn on it: a hole survives
       downscaling, a hairline does not. -->
  <rect x="57" y="43" width="14" height="38" rx="2" fill="#2b7fb5"/>

  <!-- One arc a side, well clear of the body. -->
  <path d="M92 46 a26 26 0 0 1 0 36"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"
        opacity="0.95"/>
  <path d="M36 46 a26 26 0 0 0 0 36"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"
        opacity="0.95"/>
</svg>
